[package]
name = "network-core"
version = "0.1.0"
edition = "2021"

[features]
ffi-test-support = []

[dependencies]
network-protocol = { path = "../network-protocol" }
network-identity = { path = "../network-identity" }
network-nat = { path = "../network-nat" }
network-quic = { path = "../network-quic" }
network-transfer = { path = "../network-transfer" }
network-relay = { path = "../network-relay" }
network-transport = { path = "../network-transport" }
network-webrtc = { path = "../network-webrtc" }
prost = "0.13"
quinn = "0.11"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
ed25519-dalek = "2.1"
snow = "0.9"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hex = "0.4"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
futures-util = "0.3"
network-relay = { path = "../network-relay", features = ["test-support"] }
network-transport = { path = "../network-transport", features = ["testkit"] }
rand = "0.8"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# discovery publisher 测试用 paused time（tokio::time::advance / start_paused）验证退避调度。
tokio = { version = "1.38", features = ["test-util"] }
