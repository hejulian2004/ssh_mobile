[package]
name = "network-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
network-core = { path = "../network-core" }
network-protocol = { path = "../network-protocol" }
network-webrtc = { path = "../network-webrtc" }
prost = "0.13"
tracing = "0.1"

[dev-dependencies]
network-core = { path = "../network-core", features = ["ffi-test-support"] }
