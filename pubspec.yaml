name: _
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/ssh_mobile_full
  - apps/ssh_mobile_terminal
  - packages/core/app_core
  - packages/core/app_ui
  - packages/core/connection_core
  - packages/features/feature_connection
  - packages/features/feature_monitoring
  - packages/features/feature_system_admin
  - packages/features/feature_playbook
  - packages/features/feature_rag
  - packages/features/feature_sftp
  - packages/features/feature_terminal
  - packages/features/feature_lan_share
  - packages/features/feature_mcp
  - packages/features/feature_ai
  - packages/features/feature_webview
  - packages/features/feature_developer
  - packages/infrastructure/network_transport
  - packages/infrastructure/network_sdk
  - packages/infrastructure/realtime_media
  - packages/infrastructure/ssh_core
  - packages/infrastructure/ssh_mobile_network_native

dev_dependencies:
  melos: ^8.2.2
  # Used by tool/gen_telemetry_contract.dart and
  # tool/check_telemetry_contract_generated.dart to read the YAML contract
  # source of truth (dev-only, tool-level; not a runtime dependency).
  yaml: ^3.1.3

melos:
  scripts:
    format:
      description: Format every workspace package's Dart library and test code.
      exec:
        command: dart format --output=none --set-exit-if-changed lib test
        concurrency: 4
        failFast: true
    analyze:
      description: Analyze every workspace package with the pinned Flutter SDK.
      exec:
        # Full App 当前保留既有 info 级 lint；它们不应阻断 Workspace 门禁。
        command: flutter analyze --no-fatal-infos --no-pub
        concurrency: 4
        failFast: true
    test:
      description: Run workspace tests; live backend and native-loopback integrations are optional environment gates.
      exec:
        command: flutter test --no-pub --exclude-tags=client-backend,native-loopback
        concurrency: 2
        failFast: true
