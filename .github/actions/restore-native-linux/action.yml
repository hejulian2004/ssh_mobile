name: Restore Linux native build
description: Reuse authenticated current-run artifacts and retain Cargo freshness checks.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-linux-${{ github.sha }}
        path: native/network_core/target
    - name: Validate and prepare native artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(cat native/network_core/target/native-build-revision.txt)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code -- native/network_core
        test -z "$(git ls-files --others --exclude-standard -- native/network_core)"
        sha256sum -c native/network_core/target/native-library.sha256
        # Artifact download does not preserve executable permissions. Cargo
        # may run these host build scripts when its environment changes.
        find native/network_core/target/release/build -type f -name 'build-script-*' -exec chmod +x {} +
        # Downloaded outputs are newer than the checked-out exact-commit source.
        # Set the freshness markers after all outputs; Cargo still verifies
        # compiler/options/dependency fingerprints and rebuilds on mismatch.
        find native/network_core/target -type f -name invoked.timestamp -exec touch {} +
        cd native/network_core
        cargo build -p network-ffi --release --locked --target x86_64-unknown-linux-gnu
