name: Flutter

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  NODE_VERSION: '24.19.0'
  GO_VERSION: '1.27.0'
  PROTOC_VERSION: '27.1'
  BUF_VERSION: '1.47.2'
  RUST_TOOLCHAIN: '1.97.1'

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_scope:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      base_sha: ${{ steps.filter.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Detect changed scopes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$EVENT_BEFORE_SHA"
          else
            base_sha="$EVENT_BASE_SHA"
          fi
          if [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha=""
          fi
          if [[ -z "$base_sha" ]]; then
            base_sha="$(git rev-parse "$CURRENT_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$base_sha" ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$base_sha" "$CURRENT_SHA")"
          fi
          app=false
          app_path_pattern='^(apps/ssh_mobile_full/|packages/(core|features|infrastructure)/|native/|protocol/|pubspec(\.yaml|\.lock)$|melos\.yaml$|analysis_options\.yaml$|dart_test\.yaml$|build\.yaml$|tool/|scripts/(bash|powershell)/(ci|coverage)/|\.github/workflows/flutter\.yml$)'
          if printf '%s\n' "$changed_files" | grep -Eq "$app_path_pattern"; then app=true; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Full App scope changed: $app"
          echo "Comparison base: $base_sha"

  front-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install front dependencies
        run: npm ci
      - name: Scan front dependencies
        run: npm audit --audit-level=high
      - name: Typecheck front
        run: npm run typecheck
      - name: Typecheck front tests
        run: npm run typecheck:tests
      - name: Lint front
        run: npm run lint
      - name: Test front
        run: npm run test:run
      - name: Build front
        run: npm run build
      - name: Build front container
        run: docker build -t ssh-mobile-relay-front:test .

  admin-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install front dependencies
        working-directory: front
        run: npm ci
      - name: Check Front ↔ Admin API contract
        run: bash scripts/bash/contracts/admin_api_contract.sh

  telemetry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install front dependencies
        working-directory: front
        run: npm ci
      - name: Check Telemetry contract
        run: bash scripts/bash/contracts/telemetry_contract.sh

  native-network-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/network_core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "native/network_core -> target"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Scan Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Start local coturn
        run: >-
          docker run -d --rm --name ssh-mobile-coturn --network host
          coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888 -n --log-file=stdout --lt-cred-mech
          --fingerprint --user test:test --realm=ssh-mobile.test
          --no-tls --no-dtls --min-port=49160 --max-port=49200
          --no-multicast-peers
      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1
      - name: Test WebRTC TURN fallback
        run: >-
          cargo test -p network-webrtc --locked --
          --ignored relay_only_drivers_exchange_data_channel_payloads
      - name: Stop local coturn
        if: always()
        run: docker rm -f ssh-mobile-coturn || true
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  sdk-dart-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Format SDK packages
        run: >-
          dart run melos run format
          --scope=network_sdk
          --scope=network_transport
          --scope=realtime_media
          --scope=ssh_mobile_network_native
      - name: Analyze SDK packages
        run: >-
          dart run melos run analyze
          --scope=network_sdk
          --scope=network_transport
          --scope=realtime_media
          --scope=ssh_mobile_network_native
      - name: Test SDK packages
        run: >-
          dart run melos run test
          --scope=network_sdk
          --scope=network_transport
          --scope=realtime_media
          --scope=ssh_mobile_network_native

  lan-network-v2-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "native/network_core -> target"
          shared-key: "network-sdk-${{ runner.os }}-${{ runner.arch }}"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Run LAN Network V2 targeted acceptance
        run: bash scripts/bash/ci/full_test.sh --no-bootstrap --only lan-network-v2-targeted

  relay-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    env:
      # Without these the MySQL/Redis integration tests and the multi-instance
      # tests silently t.Skip; the services below make them actually run.
      # go-sql-driver handles MySQL 8's default caching_sha2_password auth (RSA
      # exchange) automatically, so the DSN needs no extra auth parameter.
      RELAY_TEST_MYSQL_DSN: "relay:relay@tcp(127.0.0.1:3306)/relay?parseTime=true&loc=UTC"
      RELAY_TEST_REDIS_URL: "redis://127.0.0.1:6379/0"
      # Telemetry integration tests must exercise the durable Analytics store;
      # these are separate service instances and never fall back to t.Skip.
      TELEMETRY_TEST_MYSQL_DSN: "telemetry:telemetry@tcp(127.0.0.1:3307)/telemetry?parseTime=true&loc=UTC"
      TELEMETRY_MYSQL_DSN: "telemetry:telemetry@tcp(127.0.0.1:3307)/telemetry?parseTime=true&loc=UTC"
      TELEMETRY_TEST_REDIS_URL: "redis://127.0.0.1:6380/0"
      TELEMETRY_REDIS_URL: "redis://127.0.0.1:6380/0"
    services:
      # Mirrors compose.yaml storage profile (mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb, redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf).
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: relay
          MYSQL_USER: relay
          MYSQL_PASSWORD: relay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urelay -prelay"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
      analytics-mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: analytics-root-ci
          MYSQL_DATABASE: telemetry
          MYSQL_USER: telemetry
          MYSQL_PASSWORD: telemetry
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utelemetry -ptelemetry"
          --health-interval=10s --health-timeout=5s --health-retries=15
      analytics-redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.sum
      - name: Check Go formatting
        run: |
          go fmt ./...
          git diff --exit-code -- .
      - name: Test relay
        run: go test ./...
      - name: Test relay with race detector
        run: go test -race ./...
      - name: Vet relay
        run: go vet ./...
      - name: Scan relay vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  protocol-v2-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "native/network_core -> target"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Compile-check all Network V2 protos
        run: |
          protoc --proto_path=protocol \
            --descriptor_set_out=/tmp/network-v2.desc \
            protocol/proto/relay/v2/relay_v2.proto \
            protocol/proto/network/v2/network.proto
      - name: Test Network V2 parity checker
        run: dart run scripts/bash/contracts/check_network_v2_contract.dart --test
      - name: Check Network V2 schema parity
        run: dart run scripts/bash/contracts/check_network_v2_contract.dart
      - name: Run relay v2 contract check
        run: bash scripts/bash/contracts/relay_v2_contract.sh
      - name: Run strict network v2 acceptance gate
        run: bash scripts/bash/contracts/network_v2_acceptance.sh strict
      - name: buf lint
        working-directory: protocol
        run: buf lint
      - name: buf breaking against frozen Relay V2
        working-directory: protocol
        run: >-
          buf breaking .
          --against '../.git#ref=6ec194bb3a66a748215d3abc11d6da84bd329619,subdir=protocol'
          --path proto/relay/v2/relay_v2.proto

  client-backend-e2e:
    # Keep the cross-process Docker/client gate isolated from Flutter's unit
    # test process pool. It deliberately exercises the real Caddy → Go Relay
    # path and owns its temporary Compose project/cleanup trap.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        storage: [memory, mysql]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "native/network_core -> target"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        working-directory: apps/ssh_mobile_full
        run: flutter pub get
      - name: Run strict client → Caddy → Go Relay E2E
        env:
          CLIENT_BACKEND_E2E_STORAGE: ${{ matrix.storage }}
        run: bash scripts/bash/e2e/client_backend_e2e.sh strict

  architecture-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Check agent documentation
        run: dart run tool/check_agent_docs.dart
      - name: Test agent documentation checker
        run: dart run test/tool/agent_docs_check_test.dart
      - name: Test CI workflow contract
        run: dart run test/tool/ci_workflow_test.dart
      - name: Test CI production configuration
        run: dart run test/tool/ci_production_config_test.dart
      - name: Check Dart file sizes and test roots
        run: dart run tool/check_file_sizes.dart
      - name: Check telemetry contract generated
        run: dart run tool/check_telemetry_contract_generated.dart
      - name: Test telemetry contract codegen
        run: dart run test/tool/telemetry_contract_codegen_test.dart
      - name: Check architecture guard
        run: dart run tool/architecture_check.dart
      - name: Check module dependencies
        run: dart run tool/check_module_dependencies.dart
      - name: Check resource owners
        run: dart run tool/check_resource_owners.dart
      - name: Check compatibility import inventory
        run: dart run tool/compatibility_check.dart
      - name: Check duplicate implementations
        run: dart run tool/duplicate_implementation_check.dart

  workspace-core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Format core packages
        run: >-
          dart run melos run format
          --scope=app_core
          --scope=app_ui
          --scope=connection_core
          --scope=ssh_core
      - name: Analyze core packages
        run: >-
          dart run melos run analyze
          --scope=app_core
          --scope=app_ui
          --scope=connection_core
          --scope=ssh_core
      - name: Test core packages
        run: >-
          dart run melos run test
          --scope=app_core
          --scope=app_ui
          --scope=connection_core
          --scope=ssh_core

  workspace-features-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Format feature packages
        run: >-
          dart run melos run format
          --scope=feature_ai
          --scope=feature_connection
          --scope=feature_developer
          --scope=feature_lan_share
          --scope=feature_mcp
          --scope=feature_monitoring
          --scope=feature_playbook
          --scope=feature_rag
          --scope=feature_sftp
          --scope=feature_system_admin
          --scope=feature_terminal
          --scope=feature_webview
      - name: Analyze feature packages
        run: >-
          dart run melos run analyze
          --scope=feature_ai
          --scope=feature_connection
          --scope=feature_developer
          --scope=feature_lan_share
          --scope=feature_mcp
          --scope=feature_monitoring
          --scope=feature_playbook
          --scope=feature_rag
          --scope=feature_sftp
          --scope=feature_system_admin
          --scope=feature_terminal
          --scope=feature_webview
      - name: Test feature packages
        run: >-
          dart run melos run test
          --scope=feature_ai
          --scope=feature_connection
          --scope=feature_developer
          --scope=feature_lan_share
          --scope=feature_mcp
          --scope=feature_monitoring
          --scope=feature_playbook
          --scope=feature_rag
          --scope=feature_sftp
          --scope=feature_system_admin
          --scope=feature_terminal
          --scope=feature_webview

  terminal-smoke-build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "native/network_core -> target"
          shared-key: "network-sdk-${{ runner.os }}-${{ runner.arch }}"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install workspace dependencies
        run: dart pub get
      - name: Install Terminal app dependencies
        working-directory: apps/ssh_mobile_terminal
        run: flutter pub get
      - name: Build Terminal-only smoke app
        working-directory: apps/ssh_mobile_terminal
        run: flutter build windows --debug --no-pub

  app-static-quality:
    needs: change_scope
    if: needs.change_scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Check generated app icons
        run: |
          dart run tool/generate_app_icons.dart
          git diff --exit-code -- assets android ios macos web windows/runner/resources/app_icon.ico
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/database/app_database.g.dart
      - name: Security regression grep
        run: |
          if grep -R "SshIdentityCache" lib; then exit 1; fi
          if grep -R "reconnectCredentials" lib; then exit 1; fi
          if grep -R "privateKeyDigest" lib; then exit 1; fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  app-unit-tests:
    needs: change_scope
    if: needs.change_scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "native/network_core -> target"
          shared-key: "network-sdk-${{ runner.os }}-${{ runner.arch }}"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        working-directory: .
        run: dart pub get
      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Configure isolated Flutter build directory
        run: flutter config --build-dir "build/ci-test-shard-${{ matrix.shard_index }}"
      - name: Run Sharded Unit Tests
        run: |
          set -euo pipefail

          module_key_for_test() {
            local test_file="$1"
            local name first
            case "$test_file" in
              test/app/*) printf '%s\n' app ;;
              test/core/*) printf '%s\n' core ;;
              test/features/*/*)
                first="${test_file#test/features/}"
                printf 'feature/%s\n' "${first%%/*}"
                ;;
              test/features/*) printf '%s\n' feature/root ;;
              test/screens/*/*)
                first="${test_file#test/screens/}"
                printf 'screen/%s\n' "${first%%/*}"
                ;;
              test/screens/*)
                name="${test_file##*/}"
                printf 'screen/root/%s\n' "${name%%_*}"
                ;;
              test/services/*/*)
                first="${test_file#test/services/}"
                printf 'service/%s\n' "${first%%/*}"
                ;;
              test/services/*)
                name="${test_file##*/}"
                printf 'service/root/%s\n' "${name%%_*}"
                ;;
              test/utils/*) printf '%s\n' utils ;;
              test/tool/*) printf '%s\n' tool ;;
              test/*) printf '%s\n' root ;;
              *) printf '%s\n' other ;;
            esac
          }

          declare -A module_files=()
          declare -A module_sizes=()
          mapfile -d '' all_test_files < <(
            find test -type f -name '*_test.dart' -print0 | sort -z
          )
          for test_file in "${all_test_files[@]}"; do
            case "$test_file" in
              test/features/startup/views/startup_screen_test.dart|\
              test/screens/system_admin/system_admin_snapshot_tabs_test.dart|\
              test/services/network/transfer_transport_test.dart|\
              test/integration/client_backend/*)
                continue
                ;;
            esac
            module="$(module_key_for_test "$test_file")"
            module_files["$module"]+="$test_file"$'\n'
            module_sizes["$module"]=$((
              ${module_sizes["$module"]:-0} + $(wc -c < "$test_file")
            ))
          done

          if [ "${#module_sizes[@]}" -eq 0 ]; then
            echo "No coverage test files were discovered."
            exit 1
          fi

          mapfile -t sorted_modules < <(
            for module in "${!module_sizes[@]}"; do
              printf '%s\t%s\n' "${module_sizes[$module]}" "$module"
            done | LC_ALL=C sort -nr -k1,1 -k2,2 | cut -f2-
          )
          shard_sizes=(0 0 0 0)
          declare -A module_shards=()
          for module in "${sorted_modules[@]}"; do
            target=0
            for candidate in 1 2 3; do
              if ((shard_sizes[candidate] < shard_sizes[target])); then
                target="$candidate"
              fi
            done
            module_shards["$module"]="$target"
            shard_sizes[target]=$((shard_sizes[target] + module_sizes[$module]))
          done

          mapfile -t shard_files < <(
            for module in "${sorted_modules[@]}"; do
              if [[ "${module_shards[$module]}" == "${{ matrix.shard_index }}" ]]; then
                printf '%s' "${module_files[$module]}"
              fi
            done | sed '/^$/d' | LC_ALL=C sort
          )
          echo "Shard ${{ matrix.shard_index }}: ${#shard_files[@]} test files"
          if [ "${#shard_files[@]}" -eq 0 ]; then
            echo "No tests assigned to shard ${{ matrix.shard_index }}."
            exit 1
          fi

          run_batch_with_retry() {
            local batch_number="$1"
            local coverage_path="$2"
            shift 2
            local attempt status
            for attempt in 1 2; do
              rm -f "$coverage_path"
              echo "Running shard ${{ matrix.shard_index }} batch $batch_number (attempt $attempt)."
              if timeout --signal=TERM --kill-after=30s 8m \
                flutter test --no-pub \
                --coverage --coverage-path "$coverage_path" \
                --reporter compact --fail-fast --timeout 60s \
                --concurrency 1 "$@"; then
                return 0
              else
                status=$?
              fi
              if [ "$attempt" -eq 2 ]; then
                return "$status"
              fi
              echo "Flutter test batch failed or timed out; retrying once."
            done
          }

          mkdir -p coverage
          rm -f coverage/lcov.info coverage/lcov-batch-*.info
          batch_size=16
          batch=0
          for ((offset = 0; offset < ${#shard_files[@]}; offset += batch_size)); do
            batch_files=("${shard_files[@]:offset:batch_size}")
            run_batch_with_retry "$batch" "coverage/lcov-batch-${{ matrix.shard_index }}-$batch.info" "${batch_files[@]}"
            batch=$((batch + 1))
          done

          : > coverage/lcov.info
          for batch_file in coverage/lcov-batch-${{ matrix.shard_index }}-*.info; do
            [[ -f "$batch_file" ]] || continue
            if [[ ! -s coverage/lcov.info ]]; then
              cp "$batch_file" coverage/lcov.info
            else
              sed '/^TN:/d' "$batch_file" >> coverage/lcov.info
            fi
          done
          if [[ ! -s coverage/lcov.info ]]; then
            echo "No LCOV output was generated for shard ${{ matrix.shard_index }}."
            exit 1
          fi
      - name: Upload shard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-coverage-${{ matrix.shard_index }}
          path: apps/ssh_mobile_full/coverage/lcov.info
          if-no-files-found: error

  app-isolated-tests:
