      - name: Install native Dart package dependencies
        working-directory: packages/infrastructure/ssh_mobile_network_native
        run: flutter pub get
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Configure isolated Flutter build directory
        run: flutter config --build-dir build/ci-test-isolated
      - name: Run isolated startup coverage test
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            rm -f coverage/isolated-startup-lcov.info
            if timeout --signal=TERM --kill-after=30s 8m \
              flutter test --no-pub \
              --coverage --coverage-path coverage/isolated-startup-lcov.info \
              --reporter compact --fail-fast --timeout 60s --concurrency 1 \
              test/features/startup/views/startup_screen_test.dart; then
              break
            else
              status=$?
            fi
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            echo "Startup coverage test failed or timed out; retrying once."
          done
      - name: Run isolated system-admin coverage test
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            rm -f coverage/isolated-system-admin-lcov.info
            if timeout --signal=TERM --kill-after=30s 8m \
              flutter test --no-pub \
              --coverage --coverage-path coverage/isolated-system-admin-lcov.info \
              --reporter compact --fail-fast --timeout 60s --concurrency 1 \
              test/screens/system_admin/system_admin_snapshot_tabs_test.dart; then
              break
            else
              status=$?
            fi
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            echo "System-admin coverage test failed or timed out; retrying once."
          done
      - name: Run isolated transfer test
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=30s 8m \
              flutter test --no-pub \
              --reporter compact --fail-fast --timeout 60s --concurrency 1 \
              test/services/network/transfer_transport_test.dart; then
              break
            else
              status=$?
            fi
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            echo "Transfer test failed or timed out; retrying once."
          done
      - name: Upload isolated coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-coverage-isolated
          path: apps/ssh_mobile_full/coverage/isolated-*.info
          if-no-files-found: error

  app-coverage:
    needs: [change_scope, app-unit-tests, app-isolated-tests]
    if: needs.change_scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ssh_mobile_full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Full App dependencies
        run: flutter pub get
      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: flutter-coverage-*
          path: coverage-shards
      - name: Enforce shard coverage
        run: |
          mapfile -d '' shard_files < <(find "$GITHUB_WORKSPACE/coverage-shards" -type f -name lcov.info -print0 | sort -z)
          if [ "${#shard_files[@]}" -ne 4 ]; then
            echo "Expected 4 shard coverage files, found ${#shard_files[@]}."
            exit 1
          fi

          mapfile -d '' isolated_files < <(find "$GITHUB_WORKSPACE/coverage-shards" -type f -name 'isolated-*.info' -print0 | sort -z)
          if [ "${#isolated_files[@]}" -ne 2 ]; then
            echo "Expected 2 isolated coverage files, found ${#isolated_files[@]}."
            exit 1
          fi

          coverage_args=()
          for shard_file in "${shard_files[@]}"; do
            coverage_args+=("--file=$shard_file")
          done
          for isolated_file in "${isolated_files[@]}"; do
            coverage_args+=("--file=$isolated_file")
          done

          dart run tool/check_coverage.dart \
            --minimum=90 \
            --base-ref="${{ needs.change_scope.outputs.base_sha }}" \
            --source-root=lib \
            "${coverage_args[@]}"

