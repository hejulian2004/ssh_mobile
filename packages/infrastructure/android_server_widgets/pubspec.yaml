name: android_server_widgets
description: Android-native latest server monitoring snapshots for home widgets.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.hejulian.android_server_widgets
        pluginClass: AndroidServerWidgetsPlugin
