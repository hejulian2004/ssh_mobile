group 'com.hejulian.android_server_widgets'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'jacoco'

android {
    namespace 'com.hejulian.android_server_widgets'
    compileSdk 37
    defaultConfig { minSdk 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ['jdk.internal.*']
        }
    }
}

repositories { google(); mavenCentral() }
dependencies {
    implementation 'androidx.datastore:datastore-core:1.1.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    // Host JVM tests need the JVM file-replacement implementation. The Android
    // artifact uses Linux rename semantics, which cannot replace files on Windows.
    testImplementation 'androidx.datastore:datastore-core-jvm:1.1.7'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}

configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'androidx.datastore', module: 'datastore-core-android'
}

jacoco { toolVersion = '0.8.13' }
def snapshotClasses = fileTree("$buildDir/tmp/kotlin-classes/debug") {
    include 'com/hejulian/android_server_widgets/**'
    // Engine/Context adapters require the device gate; pure storage is measured.
    exclude '**/AndroidServerWidgetsPlugin*', '**/MonitorSnapshotStorage*'
}
tasks.register('widgetCoverageReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(snapshotClasses)
    sourceDirectories.setFrom(files('src/main/kotlin'))
    executionData.setFrom(fileTree(buildDir) { include '**/testDebugUnitTest.exec' })
    reports { xml.required = true; html.required = true }
}
tasks.register('verifyWidgetCoverage', JacocoCoverageVerification) {
    dependsOn 'widgetCoverageReport'
    classDirectories.setFrom(snapshotClasses)
    executionData.setFrom(fileTree(buildDir) { include '**/testDebugUnitTest.exec' })
    violationRules { rule { element = 'SOURCEFILE'; limit { counter = 'LINE'; minimum = 0.90 } } }
}
