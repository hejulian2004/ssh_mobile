name: ssh_mobile
description: Cross-platform SSH, SFTP, monitoring, and AI-assisted operations client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  app_core:
    path: ../../packages/core/app_core
  app_ui:
    path: ../../packages/core/app_ui
  connection_core:
    path: ../../packages/core/connection_core
  feature_connection:
    path: ../../packages/features/feature_connection
  feature_monitoring:
    path: ../../packages/features/feature_monitoring
  feature_system_admin:
    path: ../../packages/features/feature_system_admin
  feature_playbook:
    path: ../../packages/features/feature_playbook
  feature_rag:
    path: ../../packages/features/feature_rag
  feature_sftp:
    path: ../../packages/features/feature_sftp
  feature_terminal:
    path: ../../packages/features/feature_terminal
  feature_lan_share:
    path: ../../packages/features/feature_lan_share
  feature_mcp:
    path: ../../packages/features/feature_mcp
  feature_ai:
    path: ../../packages/features/feature_ai
  feature_webview:
    path: ../../packages/features/feature_webview
  feature_developer:
    path: ../../packages/features/feature_developer
  network_sdk:
    path: ../../packages/infrastructure/network_sdk
  dartssh2: ^2.22.5
  ssh_mobile_network_native:
    path: ../../packages/infrastructure/ssh_mobile_network_native
  network_transport:
    path: ../../packages/infrastructure/network_transport
  realtime_media:
    path: ../../packages/infrastructure/realtime_media
  realtime_media_android:
    path: ../../packages/infrastructure/realtime_media_android
  realtime_media_windows:
    path: ../../packages/infrastructure/realtime_media_windows
  ssh_core:
    path: ../../packages/infrastructure/ssh_core
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1

  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  uuid: ^4.6.0
  path: ^1.9.1
  permission_handler: ^13.0.0
  cryptography: ^2.9.0
  file_picker: ^12.0.0-beta.7
  gpt_markdown: ^1.1.8
  # Legacy SFTP/LAN compatibility screens still import the plugin directly;
  # the maintained client WebView implementation lives in feature_webview.
  webview_flutter: ^4.14.1
  fl_chart: ^1.2.0
  animations: ^2.2.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  shadcn_ui: ^0.56.1
  flutter_displaymode: ^0.7.0
  gal: ^2.3.3
  nsd: ^5.0.1
  disk_space_2: ^1.0.13
  desktop_drop: ^0.7.1
  share_handler: ^0.0.25
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  device_info_plus: ^13.2.0
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  connectivity_plus_platform_interface: ^2.1.0
  flutter_background_service_platform_interface: ^5.1.2
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  image: ^4.9.1
  path_provider_platform_interface: ^2.1.2
  permission_handler_platform_interface: ^4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
