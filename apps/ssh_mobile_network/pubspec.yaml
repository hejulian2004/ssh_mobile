name: ssh_mobile_network
description: Network-transfer app hosting the LAN share page.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/core/app_core
  app_ui:
    path: ../../packages/core/app_ui
  cryptography: ^2.9.0
  feature_lan_share:
    path: ../../packages/features/feature_lan_share
  flutter_secure_storage: ^10.3.1
  network_sdk:
    path: ../../packages/infrastructure/network_sdk
  network_transport:
    path: ../../packages/infrastructure/network_transport
  provider: ^6.1.5+1

dev_dependencies:
  drift: ^2.34.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
